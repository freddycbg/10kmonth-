# 10k Month Group — sitio estático, sin build.
[build]
  # Solo se publica site/. El resto del repositorio — README, esta misma
  # configuración, el código de la función y las skills de .claude — se
  # queda fuera del despliegue. Con publish = "." todo eso quedaba
  # accesible bajo el dominio.
  publish    = "site"
  functions  = "netlify/functions"
  command    = ""

# ── /recruiting ───────────────────────────────────────────────────────
# La landing vive en la raíz, pero también responde en /recruiting.
# Es una reescritura (status 200), no una redirección: la barra de
# direcciones se queda en /recruiting y no parpadea.
#
# Sirve para poder poner 10kmonthgroup.com/recruiting en la bio de
# Instagram desde hoy, y que ese link siga funcionando igual el día que
# la raíz del dominio pase a ser el sitio principal.
#
# Las reglas específicas van primero: Netlify aplica la primera que calce.
[[redirects]]
  from = "/recruiting/privacidad.html"
  to = "/privacidad.html"
  status = 200

[[redirects]]
  from = "/recruiting/img/*"
  to = "/img/:splat"
  status = 200

[[redirects]]
  from = "/recruiting/favicon.svg"
  to = "/favicon.svg"
  status = 200

[[redirects]]
  from = "/recruiting/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/recruiting"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options  = "nosniff"
    X-Frame-Options         = "SAMEORIGIN"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Permissions-Policy      = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# Las fotos cambian poco: cachear fuerte.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El HTML siempre fresco, para que un cambio de copy se vea al instante.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
